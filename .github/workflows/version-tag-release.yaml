name: R-Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::pkgbuild
          needs: check

      - name: Build source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist
          Rscript -e "pkgbuild::build(path = '.', dest_path = '../dist/')"

      - name: Build Windows binary
        shell: pwsh
        run: |
          Rscript -e "pkgbuild::build(binary = TRUE, path = '.', dest_path = '../dist/')"

      # Record the R version used to build the binary so it can be shown in
      # the release description.
      - name: Get R version
        id: r-version
        shell: pwsh
        run: |
          $rVersion = Rscript -e "cat(as.character(getRversion()))"
          $rPlatform = Rscript -e "cat(R.version[['platform']])"
          Write-Host "R version: $rVersion ($rPlatform)"
          "version=$rVersion" >> $env:GITHUB_OUTPUT
          "platform=$rPlatform" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body: |
            Windows binary (.zip) built with R ${{ steps.r-version.outputs.version }} (${{ steps.r-version.outputs.platform }}).
          append_body: true
          files: |
            ../dist/*.zip
            ../dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
