name: R-Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::pkgbuild
          needs: check

      - name: Build source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist
          Rscript -e "pkgbuild::build(path = '.', dest_path = '../dist/')"

      - name: Build Windows binary
        shell: pwsh
        run: |
          Rscript -e "pkgbuild::build(binary = TRUE, path = '.', dest_path = '../dist/')"

      # GitHub release assets cannot be placed in directories, so the R
      # version (major.minor) is prefixed to the binary's file name instead,
      # e.g. mypkg_0.81.zip -> R4.6_mypkg_0.81.zip
      - name: Add R version to Windows binary file name
        shell: pwsh
        run: |
          $rVersion = Rscript -e "cat(R.version[['major']], strsplit(R.version[['minor']], '.', fixed = TRUE)[[1]][1], sep = '.')"
          Write-Host "R version: $rVersion"
          Get-ChildItem -Path ../dist -Filter *.zip | ForEach-Object {
            $newName = "R${rVersion}_$($_.Name)"
            Write-Host "Renaming $($_.Name) -> $newName"
            Rename-Item -Path $_.FullName -NewName $newName
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: |
            ../dist/*.zip
            ../dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
